<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shapy — minimal example</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #0a0f1e;
        color: #f8fafc;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }

      /* 1. The custom element fills its parent. Give it a size. */
      shapy-background {
        position: fixed;
        inset: 0;
        display: block;
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(680px, 100%);
        padding: clamp(28px, 6vw, 64px);
        border: 1px solid rgb(255 255 255 / 0.14);
        border-radius: 28px;
        background: rgb(10 15 30 / 0.66);
        box-shadow: 0 30px 80px rgb(0 0 0 / 0.35);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #7dd3fc;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 7vw, 62px);
        font-weight: 500;
        letter-spacing: -0.04em;
        line-height: 1.02;
      }

      p {
        max-width: 48ch;
        margin: 20px 0 0;
        color: #cbd5e1;
        font-size: 16px;
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-top: 30px;
      }

      button {
        padding: 11px 18px;
        border: 0;
        border-radius: 999px;
        background: #7dd3fc;
        color: #06121f;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #bae6fd;
      }

      button:focus-visible {
        outline: 2px solid #f8fafc;
        outline-offset: 3px;
      }

      code {
        padding: 7px 10px;
        border: 1px solid rgb(148 163 184 / 0.25);
        border-radius: 999px;
        color: #94a3b8;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!-- 2. Add the custom element and choose a seed and palette. -->
    <shapy-background
      id="background"
      seed="4D5E465BCA"
      palette="midnight"
      density="72"
      scale="110"
    ></shapy-background>

    <main class="card">
      <p class="eyebrow">Shapy · minimal example</p>
      <h1>Your background,<br />generated from a seed.</h1>
      <p>
        This page uses one custom element. The same seed and settings always
        produce the same composition. Click the button to try a new seed.
      </p>
      <div class="actions">
        <button id="new-pattern" type="button">New pattern</button>
        <code id="seed" aria-live="polite">4D5E465BCA</code>
      </div>
    </main>

    <script type="module">
      // 3. Import the package once. This registers <shapy-background>.
      import { createSeed } from 'shapy';

      const background = document.querySelector('#background');
      const seedLabel = document.querySelector('#seed');

      // 4. Change an attribute to update the composition.
      document.querySelector('#new-pattern').addEventListener('click', () => {
        const seed = createSeed();

        background.setAttribute('seed', seed);
        seedLabel.textContent = seed;
      });
    </script>
  </body>
</html>
