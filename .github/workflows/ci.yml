name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Regenerate renderer template
        run: npm run build:template
      - name: Verify generated template is current
        run: git diff --exit-code -- packages/shapy/src/shapy-template.js
      - name: Build Vue demo
        run: npm run build
      - name: Check package tarballs
        run: npm run pack:check
